name: Build & Release (Self-Hosted)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build & attach assets to (e.g. v0.4.1)'
        required: true

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: [self-hosted, Linux, X64]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag & ensure GitHub Release exists
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "OpenTermius ${TAG}" \
              --notes $'## OpenTermius '"${TAG}"$'\n\n### macOS Gatekeeper Note (Un-notarized OSS build)\nIf macOS shows `"OpenTermius" is damaged and can'\''t be opened` after downloading via browser, drag `OpenTermius.app` to `Applications` and run once:\n```bash\nxattr -cr /Applications/OpenTermius.app\n```'
          fi

  build-linux:
    needs: ensure-release
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ensure-release.outputs.tag }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file unzip \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Linux (.deb & .AppImage)
        working-directory: client-app
        run: |
          npm ci
          npx tauri build --bundles deb,appimage

      - name: Upload Linux assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ensure-release.outputs.tag }}
          VER: ${{ needs.ensure-release.outputs.version }}
        run: |
          DEB_FILE=$(find client-app/src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1)
          APPIMAGE_FILE=$(find client-app/src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n 1)
          ASSETS=()
          [ -n "$DEB_FILE" ] && ASSETS+=("${DEB_FILE}#OpenTermius_${VER}_linux_amd64.deb")
          [ -n "$APPIMAGE_FILE" ] && ASSETS+=("${APPIMAGE_FILE}#OpenTermius_${VER}_linux_amd64.AppImage")
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

  build-windows:
    needs: ensure-release
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ensure-release.outputs.tag }}

      - name: Install Windows cross-compile tools (nsis, lld, llvm, clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis lld llvm clang curl

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin (cached on self-hosted)
        run: |
          command -v cargo-xwin >/dev/null 2>&1 || cargo install cargo-xwin --locked

      - name: Build Windows NSIS (.exe)
        working-directory: client-app
        run: |
          npm ci
          npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload Windows .exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ensure-release.outputs.tag }}
          VER: ${{ needs.ensure-release.outputs.version }}
        run: |
          EXE_FILE=$(find client-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*.exe" | head -n 1)
          gh release upload "$TAG" "${EXE_FILE}#OpenTermius_${VER}_windows_x64-setup.exe" --clobber

  build-android:
    needs: ensure-release
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ensure-release.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK 27 (self-hosted safe)
        run: |
          sudo apt-get update && sudo apt-get install -y curl unzip
          SDK_ROOT="$HOME/android-sdk"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-unpack/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-unpack
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Build Android Universal APK
        working-directory: client-app
        run: |
          npm ci
          npx tauri android build --apk

      - name: Upload Android APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ensure-release.outputs.tag }}
          VER: ${{ needs.ensure-release.outputs.version }}
        run: |
          APK_FILE=$(find client-app/src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          gh release upload "$TAG" "${APK_FILE}#OpenTermius_${VER}_android_universal.apk" --clobber
